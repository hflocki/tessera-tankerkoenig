name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please fill in every field: an issue without the version and the screen is hard to act on.
        One problem per issue. To agree with an existing issue, add a 👍 reaction instead of a comment.
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Shown on the screen's Plugins tab.
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: screen
    attributes:
      label: Screen and Tessera version
      placeholder: "Guition 4\", Tessera 0.4.91"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: Tile size, options you set, the entities you use.
      placeholder: |
        1. Add the tile at 2x2
        2. Choose ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log or screenshot
      description: The screen's log (ESPHome logs) around the problem, or a photo of the screen. Remove tokens and passwords.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I use the newest version of the plugin.
          required: true
        - label: I searched the open and closed issues for the same problem.
          required: true
