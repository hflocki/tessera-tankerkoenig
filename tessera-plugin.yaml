# Fuel prices from Home Assistant's Tankerkönig integration: one template sensor gathers the stations you choose into
# lists, and this tile shows their prices for E5, E10 and diesel, whether they are open, sorted and filtered the way
# you choose. No internet service of its own: the integration already asks Tankerkönig. Every field is explained in
# docs/MANIFEST.md of tessera-plugins.
id: tankerkoenig
version: 1.1.6
# 0.9: Tone::GOOD and one-line labels; a tile of an entity with has_attributes needs 0.5.
api: "0.9"
icon: car
maintainer: hflocki
license: MIT
stage: beta
topics: [travel, money]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 16

permissions:
  # The top bar item reads the template sensor's lists itself.
  read_entities: ["{prices}"]

inputs:
  # The template sensor of the README, for the top bar item. The tiles choose theirs in the inspector.
  - { id: prices, kind: entity, domains: [sensor], scope: screen, label: input_prices, hint: input_prices_hint }

tiles:
  - id: prices
    name: tile_name
    icon: car
    sizes: { min: 1x1, max: 4x4 }
    # Up to six rows of eight labels, a header of four, the single view (four labels, an arrow, three fuel rows of
    # four), and ten stations of fixed fields.
    memory: 7400
    # The template sensor of the README: lists of the stations' names, addresses, open state and prices, in the order
    # of its device list. Only sensors with these lists are offered in the inspector.
    domains: [sensor]
    has_attributes: [station_names]
    attributes: [station_names, station_places, station_open, e5, e10, diesel]
    example: tile_example
    options:
      - { id: diesel, kind: toggle, default: true, label: fuel_diesel, hint: fuel_hint }
      - { id: e10, kind: toggle, default: true, label: fuel_e10 }
      - { id: e5, kind: toggle, default: true, label: fuel_e5 }
      - id: sort
        kind: choice
        default: none
        label: sort
        hint: sort_hint
        choices: [{ value: none, label: sort_none }, { value: diesel, label: fuel_diesel },
                  { value: e10, label: fuel_e10 }, { value: e5, label: fuel_e5 }]
      - { id: front, kind: text, label: front, hint: front_hint }
      - { id: cheapest, kind: number, min: 0, max: 10, step: 1, default: 0, label: cheapest, hint: cheapest_hint }
      - { id: hide_closed, kind: toggle, default: false, label: hide_closed, hint: hide_closed_hint }
      - { id: address, kind: toggle, default: true, label: address, hint: address_hint }
      - { id: status, kind: toggle, default: true, label: status, hint: status_hint }
      - { id: changes, kind: toggle, default: true, label: changes, hint: changes_hint }

cards:
  # A tap on the tile: every station with every fuel, its address and whether it is open.
  - { id: stations, name: card_name, wide: false }

bar_items:
  # The cheapest price of the chosen fuel while it is at the limit set on the screen or under ("Diesel 1,759 · JET").
  - { id: cheap, label: bar_cheap_label, icon: car, example: bar_example }

# The three settings of plugin.yaml, also in the plugin's details on the screen's Plugins tab (their names as ids).
settings:
  - { key: fuel_alert, label: setting_alert, hint: setting_alert_hint }
  - { key: fuel_alert_type, label: setting_alert_fuel }
  - { key: fuel_alert_price, label: setting_alert_price, hint: setting_alert_price_hint }
